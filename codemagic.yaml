workflows:
  native-android-workflow:
    name: Android Binary Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    triggering:
      events:
        - push
    scripts:
      - name: Build Android Release
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
